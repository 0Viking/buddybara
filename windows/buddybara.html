<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buddybara</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #buddybara {
        position: absolute;
        left: 0;
        top: 0;
        width: 120px;
        height: 120px;
        transition: opacity 0.45s ease-in-out;
      }
      /* Buddy mode: his minimize button, while the pointer is over him. Its
         clicks get through where desktop.rs logic::HIDE_BUTTON says. */
      #hide {
        position: absolute;
        left: 85px;
        top: 19px;
        width: 18px;
        height: 18px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        outline: none;
        background: rgba(15, 16, 18, 0.85);
        color: #fff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      body.near #hide {
        opacity: 1;
        pointer-events: auto;
      }
      body.near #hide:hover {
        background: rgba(70, 72, 78, 0.95);
      }
    </style>
  </head>
  <body>
    <canvas id="buddybara"></canvas>
    <script type="module" src="/src/desktop/main.ts"></script>
  </body>
</html>
